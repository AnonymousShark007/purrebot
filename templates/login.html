{% extends "base.html" %}
{% block title %}Logg inn — Purrebot{% endblock %}
{% block head %}
<style>
  .auth-wrap { max-width: 420px; margin: 60px auto; padding: 0 24px; }
  .auth-wrap h1 { font-size: 1.6rem; font-weight: 800; color: var(--navy); margin-bottom: 6px; }
  .auth-wrap p { color: var(--muted); margin-bottom: 28px; font-size: 0.9rem; }
  .auth-link { display: block; text-align: center; margin-top: 18px; font-size: 0.875rem; color: var(--muted); }
  .auth-link a { color: var(--blue); text-decoration: none; font-weight: 600; }
</style>
{% endblock %}
{% block content %}
<div class="auth-wrap">
  <h1>Logg inn</h1>
  <p>Velkommen tilbake til Purrebot.</p>
  <div class="card">
    <form method="POST">
      <div class="form-group">
        <label for="email">E-postadresse</label>
        <input type="email" id="email" name="email" required placeholder="deg@eksempel.no" />
      </div>
      <div class="form-group">
        <label for="password">Passord</label>
        <input type="password" id="password" name="password" required placeholder="••••••••" />
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;padding:12px">Logg inn</button>
    </form>
  </div>
  <p class="auth-link">Har du ikke konto? <a href="/register">Registrer deg gratis</a></p>
</div>
{% endblock %}
